name: Build ImmortalWRT for Cudy AX3000

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl time

      - name: 将LAN口默认IP从192.168.6.1修改为192.168.10.1
        run: |
          # 可能存放LAN口IP配置的文件路径
          config_files=(
            "package/base-files/files/bin/config_generate"
            "package/base-files/files/etc/config/network"
            "target/linux/mediatek/files-5.4/etc/config/network"
            "target/linux/mediatek/files-6.6/etc/config/network"
          )
          
          # 查找包含原始IP（192.168.6.1）的配置文件并替换
          found=0
          for file in "${config_files[@]}"; do
            if [ -f "$file" ]; then
              echo "检查配置文件: $file"
              if grep -q '192.168.6.1' "$file"; then
                echo "在 $file 中找到原始IP，开始修改..."
                sed -i 's/192.168.6.1/192.168.10.1/g' "$file"
                found=1
                # 验证修改结果
                if grep -q '192.168.10.1' "$file"; then
                  echo "$file 已成功修改为192.168.10.1"
                else
                  echo "$file 修改失败"
                  exit 1
                fi
                break
              fi
            fi
          done
          
          # 若未找到原始IP配置，使用备用方法强制设置
          if [ $found -eq 0 ]; then
            echo "未找到192.168.6.1的配置，尝试强制设置LAN口IP..."
            # 创建自定义网络配置文件（优先级高于默认配置）
            mkdir -p files/etc/config/
            cat > files/etc/config/network <<'EOF'
config interface 'lan'
    option type 'bridge'
    option ifname 'eth0.1'
    option proto 'static'
    option ipaddr '192.168.10.1'
    option netmask '255.255.255.0'
    option ip6assign '60'
EOF
            echo "已创建自定义网络配置，强制设置LAN口为192.168.10.1"
            found=1
          fi
          
          if [ $found -eq 0 ]; then
            echo "LAN口IP修改失败"
            exit 1
          fi

      - name: 配置编译选项（适配Cudy AX3000）
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_TARGET_mediatek_mt798x=y" > .config
          echo "CONFIG_TARGET_mediatek_mt798x_DEVICE_cudy_ax3000=y" >> .config
          
          # 基础LuCI组件
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          
          # 生成配置
          make defconfig

      - name: 开始编译固件
        run: |
          CORES=$(nproc)
          echo "使用$CORES核进行编译"
          make -j$CORES V=s

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax3000-firmware
          path: bin/targets/mediatek/mt798x/
