name: Build ImmortalWRT for Cudy AX3000

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl time

      - name: 克隆ImmortalWRT源码
        run: |
          git clone https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt
          git checkout master

      - name: 修改LAN口IP（192.168.6.1 → 192.168.10.1）
        run: |
          cd immortalwrt
          config_files=(
            "package/base-files/files/bin/config_generate"
            "package/base-files/files/etc/config/network"
            "target/linux/mediatek/files-6.6/etc/config/network"
          )
          
          found=0
          for file in "${config_files[@]}"; do
            if [ -f "$file" ] && grep -q '192.168.6.1' "$file"; then
              sed -i 's/192.168.6.1/192.168.10.1/g' "$file"
              echo "已修改 $file 中的IP地址"
              found=1
            fi
          done
          
          if [ $found -eq 0 ]; then
            echo "未找到默认IP，创建自定义配置..."
            mkdir -p files/etc/config/
            cat << 'EOF' > files/etc/config/network
config interface 'lan'
    option type 'bridge'
    option ifname 'eth0.1'
    option proto 'static'
    option ipaddr '192.168.10.1'
    option netmask '255.255.255.0'
EOF
          fi

      - name: 配置编译选项
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 使用defconfig而不是手动设置
          make defconfig
          
          # 确保选择了正确的设备
          echo "CONFIG_TARGET_mediatek_mt798x=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt798x_DEVICE_cudy_ax3000=y" >> .config
          make defconfig

      - name: 开始编译
        run: |
          cd immortalwrt
          make -j$(nproc) V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: cudy-ax3000-firmware
          path: immortalwrt/bin/targets/mediatek/mt798x/
