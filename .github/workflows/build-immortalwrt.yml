name: Build ImmortalWRT for Cudy AX3000

on:
  workflow_dispatch:  # 支持手动触发
  push:
    branches: [ main ]  # 推送代码时自动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl time

      - name: 将LAN口默认IP修改为192.168.10.1
        run: |
          # 修改配置文件中的默认IP地址
          sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate
          # 验证修改结果
          if grep -q '192.168.10.1' package/base-files/files/bin/config_generate; then
            echo "LAN口IP修改成功"
          else
            echo "LAN口IP修改失败"
            exit 1
          fi

      - name: 配置编译选项（适配Cudy AX3000）
        run: |
          # 更新软件源
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 配置目标设备为Cudy AX3000
          echo "CONFIG_TARGET_mediatek_mt798x=y" > .config
          echo "CONFIG_TARGET_mediatek_mt798x_DEVICE_cudy_ax3000=y" >> .config  # 关键：Cudy AX3000设备配置
          
          # 启用LuCI Web管理界面
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config  # 启用HTTPS支持
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config  # 防火墙管理
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config  # 软件包管理
          
          # 生成完整配置
          make defconfig

      - name: 开始编译固件
        run: |
          # 根据CPU核心数自动调整编译线程
          CORES=$(nproc)
          echo "使用$CORES核进行编译"
          make -j$CORES V=s  # V=s显示详细日志，便于排查错误

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ax3000-firmware
          path: bin/targets/mediatek/mt798x/  # 固件输出路径
